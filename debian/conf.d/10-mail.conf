# Mail location for vpopmail Maildir layout.
# ~ expands to pw_dir from the SQL userdb query
# (e.g. /home/vpopmail/domains/example.com/user).
mail_driver = maildir
mail_path = ~/Maildir

# Run as the vpopmail user (uid/gid 89).
mail_uid = vpopmail
mail_gid = vchkpw
first_valid_uid = 89
last_valid_uid = 89
first_valid_gid = 89
last_valid_gid = 89

namespace inbox {
  inbox = yes
}
