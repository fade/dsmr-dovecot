# Mail location for vpopmail Maildir layout.
# mail_home (~) is set per-user from the SQL userdb query (pw_dir field).
# Clear the global mail_home so the per-user home from userdb takes effect.
mail_home =
mail_driver = maildir
mail_path = ~/Maildir
# INBOX is the Maildir root; qmail/vpopmail delivers to ~/Maildir/new/.
# Without this, dovecot 2.4 defaults to ~/Maildir/.INBOX/ which is incompatible.
mail_inbox_path = ~/Maildir

# Run mail processes as the vpopmail user (uid/gid 89).
mail_uid = vpopmail
mail_gid = vchkpw
first_valid_uid = 89
last_valid_uid = 89
first_valid_gid = 89
last_valid_gid = 89

namespace inbox {
  inbox = yes
}
