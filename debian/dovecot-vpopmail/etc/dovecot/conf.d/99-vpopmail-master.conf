# Run IMAP mail processes as the vpopmail user so they can read
# Maildir directories under /home/vpopmail/domains/.
service imap {
  user = vpopmail
}

# Auth socket: allow vpopmail processes to query auth.
service auth {
  unix_listener auth-userdb {
    mode = 0660
    user = vpopmail
    group = vchkpw
  }
}
