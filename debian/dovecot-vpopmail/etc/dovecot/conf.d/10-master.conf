# IMAP service.
service imap-login {
  inet_listener imap {
    port = 143
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}

service imap {
  # Run as vpopmail so it can access Maildir under /home/vpopmail/domains/.
  user = vpopmail
}

# Auth service: allow vpopmail uid/gid to connect to the auth socket.
service auth {
  unix_listener auth-userdb {
    mode = 0660
    user = vpopmail
    group = vchkpw
  }
}
