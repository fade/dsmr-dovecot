# Mail location for vpopmail Maildir layout.
# mail_home (~) is set per-user from the SQL userdb query (pw_dir).
mail_driver = maildir
mail_path = ~/Maildir

# Run mail processes as the vpopmail user (uid/gid 89).
mail_uid = vpopmail
mail_gid = vchkpw
first_valid_uid = 89
last_valid_uid = 89
first_valid_gid = 89
last_valid_gid = 89

namespace inbox {
  inbox = yes
}
